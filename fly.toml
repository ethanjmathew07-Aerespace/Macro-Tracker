app = "replace-with-your-fly-app-name"
primary_region = "dfw"

[build]

[env]
  PORT = "5001"
  FLASK_DEBUG = "0"
  DATABASE_PATH = "/data/macro_tracker.db"
  PLAYWRIGHT_DISABLE_SANDBOX = "1"

[[mounts]]
  source = "macro_tracker_data"
  destination = "/data"

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
